
name: Build Hisab Sathi APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android project
        id: project
        run: |
          if ! find . -name settings.gradle -type f | grep -q .; then
            ZIP=$(find . -type f -iname 'HisabSathi*.zip' | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "Android project ZIP not found"
              exit 1
            fi
            mkdir -p _android_src
            unzip -q "$ZIP" -d _android_src
          fi

          SETTINGS=$(find . -name settings.gradle -type f | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found"
            exit 1
          fi

          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          gradle --no-daemon -p "${{ steps.project.outputs.dir }}" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hisab-Sathi-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
